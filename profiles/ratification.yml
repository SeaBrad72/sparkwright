# Reference RATIFICATION workflow — the DEVELOPMENT-PROCESS.md §13 separation-of-duties gate, alone.
# THE SINGLE, STACK-NEUTRAL SOURCE. This gate runs only conformance/agent-boundary.sh +
# promotion-readiness.sh on ubuntu-latest — no toolchain step — so it is IDENTICAL for every stack and
# lives here once (profiles/ratification.yml — a shared, non-stack asset, like profiles/_TEMPLATE.md),
# NOT once per profile. scripts/incept.sh installs it for EVERY stack, unconditionally;
# conformance/ratification-parity.sh locks that it stays the sole, wired, stack-neutral copy. (It was
# under profiles/typescript-node/ only because ts-node was the first profile when CP-9 built it —
# RATIFY-PARITY relocated it here so no stack is deficient on §13.)
# COPY & ADAPT: incept copies this file to your project's .github/workflows/ratification.yml. It is
# INERT here in the kit repo (GitHub only runs workflows under .github/workflows/). The kit runs the
# same gate on itself — .github/workflows/ratification.yml (its own dogfooding copy, export-ignored).
#
# WHY A SEPARATE FILE FROM ci.yml. The gate must re-run when a human approves, or the approval lands
# and the check stays stale at its pre-approval verdict. That needs a `pull_request_review` trigger —
# and putting one on ci.yml would re-run your ENTIRE test suite on every review event. Guarding each
# job with an `if:` would work only until someone adds a job and forgets. A separate workflow makes
# "a review re-runs the gate and nothing else" structural instead of remembered.
#
# WHY GREEN WHILE WAITING, RED ONLY WHEN SOMETHING IS WRONG (changed 2026-08-28; it was briefly
# "red while waiting", and before that a faked yellow). The DECISION LOGIC — agent-boundary.sh's rc
# 0/1/2 contract — is not what changed here. Only the colour this job renders it in.
#
# THE HISTORY IN ONE PARAGRAPH. An earlier design rendered WAITING as YELLOW by POSTING a check-run
# with no conclusion, from a job whose key deliberately differed from the check name. It worked until
# it didn't: branch protection stopped MATCHING API-posted check-runs, and PRs stranded at "Expected —
# waiting for status to be reported" with no way to clear them but an admin merge. So there is no
# poster: this is a plain job whose OWN CONCLUSION is the verdict. A job has only
# success/failure/skipped/cancelled, so WAITING was rendered RED — and a red that means "nothing is
# wrong" is the fastest way to teach a team to stop reading reds.
#
# WHAT THIS JOB DOES NOW:
#   rc 0 — ratified, or no control-plane path in the diff -> GREEN.
#   rc 1 with NO approval yet -> GREEN plus a ::notice saying so. Blocking here was REDUNDANT: your
#        branch protection's "Require approvals >= 1" is server-side and already blocks the merge until
#        a human approves. This check explains the state; the review requirement enforces it.
#   rc 1 with an approval PRESENT that still does not ratify -> RED plus an ::error. The approver is
#        the author, the review list was unreadable, or the class fail-safed. A human acted and the
#        gate did not clear: that is a real defect and it is loud.
#   rc 2 — the gate could not evaluate the diff -> RED plus an ::error.
#
# ⚠️ IT ALSO CURES WORST-WINS. `pull_request` and `pull_request_review` both run this job on one head,
# and GitHub keeps the WORST conclusion per context — so while waiting reddened, the pre-approval red
# could outvote the post-approval green and the check stayed failed after a valid approval. A green
# waiting run cannot outvote anything.
#
# ⚠️ DECLARED DEPENDENCY — READ THIS BEFORE YOU COPY THE FILE. This rendering is honest only while your
# review requirement exists. `scripts/branch-protection-apply.sh` sets `required_approving_review_count:
# 1`; if you drop it to 0, an unratified control-plane PR shows a GREEN check and nothing blocks it.
# The setting is the block. This check is the explanation. Ship both or neither.
#
# BRANCH PROTECTION: add `control-plane-ratification` to your required status checks so it BLOCKS.
# The required context is the JOB KEY, which is exactly that string. You may move the job to another
# workflow FILE; you may not RENAME the key without updating branch protection — doing so silently
# unbinds the gate.
name: Ratification

on:
  pull_request:
  pull_request_review:
    # An approval IS the ratification signal, so every event that can add, change, or REVOKE one must
    # re-evaluate the gate — `dismissed` included, so a withdrawn approval returns the check to WAITING
    # (green with a notice; the dismissal also returns your review requirement to unsatisfied, and that
    # is what re-blocks the merge — the block never depended on this check's colour).
    types: [submitted, edited, dismissed]

permissions:
  contents: read

jobs:
  control-plane-ratification:
    # §13 governance gate (harness-independent): a control-plane diff must be human-ratified.
    # NOT one of the 7 required build gates — a separate governance step.
    #
    # ⚠️ THE JOB KEY IS THE REQUIRED STATUS CONTEXT. It must stay exactly `control-plane-ratification`;
    # renaming it unbinds the gate from branch protection without any error anywhere.
    runs-on: ubuntu-latest
    # ⚠️ THERE IS NO JOB-LEVEL `if:` HERE, AND ITS ABSENCE IS A CONTROL. DO NOT ADD ONE.
    #
    # A SKIPPED JOB IS A MISSING REQUIRED VERDICT. The job key IS the required status context, so when a
    # job-level `if:` evaluates false GitHub reports `skipped` under that name — which either satisfies
    # the required check (fail-open) or leaves it hanging at "Expected", depending on your protection
    # settings. Neither is what you want from a governance gate.
    #
    # This file used to carry `if: pull_request || (pull_request_review && head.repo.full_name ==
    # github.repository)`, restricting the review re-trigger to same-repo PRs. That existed because the
    # job held `checks: write` to POST its verdict, and `pull_request_review` can run in the BASE-repo
    # context where a fork PR's token may be WRITABLE — "run the fork's code while holding the token
    # that posts the fork's verdict". Nothing is posted now and the permissions block below is
    # read-only, so the premise is gone — and the cost of keeping it is real: a fork author can fire
    # `pull_request_review` on their own PR with a COMMENTED self-review (GitHub forbids self-APPROVAL
    # but permits that) and skip the gate.
    #
    # The real control is unchanged and is the checkout below: the gate is adjudicated from the BASE
    # tree, so a PR cannot rewrite the code that judges it. If you ever need a fork distinction again,
    # put it at STEP level and make sure it cannot change the job's conclusion.
    permissions:
      # READ-ONLY. No `checks: write` — nothing is posted; the job's own conclusion is the verdict.
      contents: read
      pull-requests: read
    steps:
      # ★ THE GATE IS ADJUDICATED FROM THE BASE TREE — IT NEVER CHECKS OUT OR EXECUTES PR-HEAD CODE.
      #
      # This job runs the gate's own logic (conformance/agent-boundary.sh, promotion-readiness.sh, and
      # the deny-matrix they source) AND ITS OWN EXIT CODE IS THE REQUIRED CONTEXT. If it checked out
      # the PR head, it would be RUNNING CODE THE PR UNDER TEST CONTROLS to compute that PR's verdict.
      # Two ways that ends badly, and neither needs a fork:
      #   1. A PR rewrites conformance/agent-boundary.sh so the decision always says rc=0, then its
      #      author submits a COMMENTED review on their own PR (GitHub forbids self-APPROVAL but permits
      #      a self-comment-review, and it fires pull_request_review) -> the gate re-runs, executes the
      #      PR's own logic, and exits 0. The author ratifies themselves.
      #   2. A PR neuters the control-plane path predicate -> the gate finds nothing to ratify -> rc=0 ->
      #      green. The gate declares the very change that disarms it to be nothing to ratify.
      # Checking out the BASE commit makes the adjudicating code the TRUSTED copy — the one already on
      # your default branch, which a human already approved. A PR cannot weaken the gate judging it.
      #
      # It also makes the listing head-independent: it comes from the PR files API below, not a git diff
      # of a working tree — so "which ref did we check out" can no longer produce an EMPTY diff that
      # reads as "no control-plane paths" (rc=0) and goes GREEN on an unratified PR.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Compute changed files (from the PR files API — never from the PR's own tree)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # `set -e` is on: a failed API call aborts the step -> the job fails -> the required check is
          # RED -> the merge is BLOCKED. Fail-closed, by construction.
          # RENAME COLLAPSE (T2). The Files API reports a rename as ONE entry whose `filename` is the
          # DESTINATION; the source lives only in `previous_filename`. A bare `.[].filename` dropped the
          # source, so moving a control-plane file to an ordinary path produced an all-ordinary listing
          # and this gate passed with nothing to ratify. Emitting BOTH is monotone (a rename can only ADD
          # the source; the class is the highest present). `// empty` omits the key for non-renames.
          # NEWLINE GUARD (T2, second half). `jq -r` emits a RAW newline, so a crafted filename splits ONE
          # API entry into TWO lines that each classify separately — measured to defeat a suffix-constrained
          # control-plane pattern and turn this gate GREEN. `error()` -> jq non-zero -> gh non-zero ->
          # `set -e` aborts -> the job is RED -> the merge is blocked. Fail-closed.
          gh api "repos/${REPO}/pulls/${PR}/files" --paginate -q '[.[] | .filename, (.previous_filename // empty)] | if any(test("\n")) then error("changed path contains a newline byte — refusing to emit a splittable listing") else .[] end' > /tmp/changed.txt
          echo "changed files seen by the gate:"
          cat /tmp/changed.txt
      - name: Compute ratification signal (non-author approval)
        id: ratify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          rat=0
          # OPTIMISTIC ONLY BECAUSE THE FAILURE PATH BELOW CLEARS IT. A route that cannot read the
          # review data sets this to 0, and the render mode treats 0 as RED — never as "waiting".
          reviews_readable=1
          # Ratification = a non-author APPROVAL (an agent cannot approve its own PR; GitHub forbids
          # self-approval). A self-appliable label would be agent-forgeable, so there isn't one; solo
          # maintainers ratify via a logged enforce_admins:false admin-merge.
          # FAIL CLOSED: an unreadable review list is NOT an approval. Guarded inside `if !` so a
          # failing command substitution cannot trip set -e and abort the step.
          # `map(last)` takes each author's most recent review OF ANY STATE — but a COMMENTED review does
          # not supersede an APPROVED one in GitHub's semantics. Without the filter below, "approve, then
          # leave a comment" reads back as UNRATIFIED, parking the check at WAITING forever and pushing
          # the maintainer toward an --admin override — the bug would push people AWAY from SoD.
          if ! approvers=$(gh pr view "$PR" --json reviews \
              -q '.reviews
                  | map(select(.state=="APPROVED" or .state=="CHANGES_REQUESTED" or .state=="DISMISSED"))
                  | group_by(.author.login) | map(last) | .[]
                  | select(.state=="APPROVED") | .author.login'); then
            echo "control-plane-ratification: could not read reviews (gh pr view rc != 0) — treating as UNRATIFIED, and marking the review list UNREADABLE."
            approvers=""
            # ★★ THIS FLAG IS WHAT KEEPS THE GREEN-WHILE-WAITING RENDERING FAIL-CLOSED. UNRATIFIED
            # alone is not enough: an empty approver list makes approvals_seen 0, which a count cannot
            # tell apart from "nobody has approved yet" — the arm that renders GREEN — while your
            # branch protection's required approval may ALREADY be satisfied server-side. The PR would
            # then merge with the non-author property never evaluated. "No one approved" and "we could
            # not find out" are different answers, and only the first one is green.
            reviews_readable=0
          fi
          # `grep -q .` also matches a line of spaces/tabs — a whitespace-only line would count as an
          # approver and set rat=1. That is a FAIL-OPEN. Require a non-whitespace character.
          if printf '%s\n' "$approvers" | grep -vxF -- "$AUTHOR" | grep -q '[^[:space:]]'; then rat=1; fi
          # ★ approvals_seen — THE SECOND OUTPUT, AND THE BASIS OF THE GREEN-WHILE-WAITING RENDERING.
          # `rat` says whether this is ratified; it cannot say WHY not, and the two reasons want
          # opposite colours: 0 approvals = nobody has looked yet (healthy, green with a notice);
          # >=1 approval and still unratified = a human ACTED and the gate did not clear (defective,
          # red). Counted over ALL approvers INCLUDING the author — a self-approval is precisely one of
          # the defective states this exists to see. An unreadable review list leaves `approvers` empty
          # and would count 0, so the merge-gate never trusts this count alone; the rc=2 escalations
          # below run first and red on their own.
          approvals_seen=$(printf '%s\n' "$approvers" | grep -c '[^[:space:]]' || true)
          echo "control-plane-ratification: approvals seen on this head (any author): $approvals_seen; ratified=$rat; reviews_readable=$reviews_readable"
          echo "ratified=$rat" >> "$GITHUB_OUTPUT"
          echo "approvals_seen=$approvals_seen" >> "$GITHUB_OUTPUT"
          echo "reviews_readable=$reviews_readable" >> "$GITHUB_OUTPUT"
      # THE VERDICT STEP: it computes the rc and then ENDS THE JOB ON IT — green while waiting for a
      # human, red when something is actually wrong (see the header). No token, nothing posted — this
      # job's conclusion IS the required context.
      - name: Ratification merge-gate (green while waiting, red when something is wrong)
        env:
          # Bound through env, never interpolated into a `run:` line — the same rule every other value
          # in this workflow follows. This one is gate-derived (a bare 0/1) and inert, but a lone
          # `${{ }}` inside a shell line is the shape a later edit copies when the value is not.
          RATIFIED: ${{ steps.ratify.outputs.ratified }}
          # Gate-derived too (bare integers), bound through env for the same reason as RATIFIED.
          APPROVALS_SEEN: ${{ steps.ratify.outputs.approvals_seen }}
          # 0 = the review list could not be read. Not defaulted anywhere downstream: the render mode
          # routes an empty value to its `error` arm rather than to the value that renders green.
          REVIEWS_READABLE: ${{ steps.ratify.outputs.reviews_readable }}
        run: |
          # CI= cleared so agent-boundary keeps its true three-state (CI would escalate 2->1):
          #   0 = ratified / no control-plane change · 1 = unratified control-plane · 2 = cannot evaluate.
          set +e
          CI= sh conformance/agent-boundary.sh --changed /tmp/changed.txt --ratified "$RATIFIED"
          rc=$?
          set -e
          # Every real PR changes at least one file. So an EMPTY listing never means "nothing to
          # ratify" — it means the gate could not SEE the diff (wrong checkout ref, bad base, failed
          # fetch). Left alone that reads as rc=0 and goes GREEN on an unratified control-plane PR.
          # Force rc=2 (a genuine gate error) so the fail-open is closed structurally.
          if [ ! -s /tmp/changed.txt ]; then
            echo "control-plane-ratification: the changed-file listing is EMPTY. A pull request always changes at least one file, so this is a gate ERROR (the diff could not be computed), NOT an absence of control-plane changes. Escalating rc -> 2 (fail-closed)."
            rc=2
          fi
          # [A4] The EMPTY case above catches a listing we could not build. This catches one the forge
          # TRUNCATED: the List-PR-files API stops at a cap and reports SUCCESS, so `set -e` never
          # fires and the listing looks healthy while paths are missing — the gate would then go
          # GREEN "nothing to ratify" on a change-set nobody can enumerate. Decision lives in
          # agent-boundary.sh; only the escalation is inline. Capture the rc rather than letting a bare
          # call abort the step: the step must reach the end and report the verdict in words before
          # exiting on it.
          # VERSION SKEW: this job checks out the BASE tree, so the workflow can call a conformance mode
          # the checked-out script does not have yet — guaranteed on the PR introducing it, and the
          # normal upgrade path for an adopter whose profiles/ and conformance/ advance out of step.
          # Detect it rather than reporting "unsupported flag" as a truncated change-set.
          if grep -q -- '--check-complete' conformance/agent-boundary.sh 2>/dev/null; then
            set +e
            CI= sh conformance/agent-boundary.sh --check-complete --changed /tmp/changed.txt
            cap_rc=$?
            set -e
            if [ "$cap_rc" != "0" ]; then
              echo "control-plane-ratification: the changed-file listing could not be verified COMPLETE (see the reason above). An unverifiable change-set is not ratifiable. Escalating rc -> 2 (fail-closed)."
              rc=2
            fi
          else
            echo "control-plane-ratification: this checkout's conformance/agent-boundary.sh predates --check-complete, so TRUNCATION IS UNCHECKED for this run. Expected during an upgrade where profiles/ and conformance/ advance out of step. Every other tripwire still applies."
          fi
          state=$(CI= sh conformance/agent-boundary.sh --changed /tmp/changed.txt \
                    --ratified "$RATIFIED" --state 2>/dev/null || echo NONE)
          # ★★★ THE TWO RECONCILIATION ARMS THAT USED TO SIT HERE ARE DELETED
          # (GUARD-PATH-ENUMERATION-INCOMPLETE S2 M2), MIRRORING .github/workflows/ratification.yml.
          # Recorded, not silently dropped:
          #   ARM 1 (`state != NONE -> class=control-plane`) papered over `--class` being guard-core-only
          #     and UNDER-DETECTING adapter-declared paths (GEMINI.md, .gemini/*, .cursor/rules/*) that
          #     this gate itself treats as control-plane. S2 made the classifier union-aware, so both
          #     sides now derive the same set and the arm is redundant. It only ever fixed the DISPLAY —
          #     the verdict comes from `$rc` alone — so deleting it changes no verdict.
          #   ARM 2 (`class = control-plane -> class=sensitive`) was a FABRICATION: reachable only when
          #     `--class` had FAIL-SAFED, it relabelled "the class could not be derived" as a specific
          #     token nothing had derived, on the surface a human reads before approving.
          # THE REPLACEMENT is honesty instead of reconciliation. rc semantics are untouched.
          class_err=/tmp/class-stderr.txt
          set +e
          class=$(sh conformance/promotion-readiness.sh --class --no-verify \
                    --changed /tmp/changed.txt 2>"$class_err")
          class_rc=$?
          set -e
          failsafe=""
          # ⚠️ VALIDATE THE TOKEN BEFORE IT IS PASSED ANYWHERE. `agent-boundary.sh --conclusion`
          # hard-validates `--for-class` against a CLOSED token set and refuses to emit a mapping for
          # anything else; the render below would then have no title/summary — the check would red with
          # no remedy in it, on every PR in that state. A disclosure string is NEVER passed as
          # --for-class — this variable stays a token, always, and the prose lives in $failsafe.
          case "$class" in
            ordinary|sensitive|control-plane) ;;
            *) failsafe="the classifier answered a token this gate does not recognise"; class=control-plane ;;
          esac
          if [ "$class_rc" != 0 ]; then
            failsafe="the classifier exited $class_rc"; class=control-plane
          elif [ -z "$failsafe" ] && grep -q 'FAIL-SAFED' "$class_err" 2>/dev/null; then
            failsafe=$(grep -m1 'FAIL-SAFED' "$class_err" | tr -d '[:cntrl:]' | cut -c1-300)
          fi
          # B2 Δ4(ii), MIRRORED from .github/workflows/ratification.yml (reviewer I4: adopters were
          # getting the gate without the visibility half of the disposition — the mirror-divergence
          # class B6 paid a Critical for). The derived lines go onto the judgment surface (the
          # step summary) so a reviewer sees what the gate derived without opening the log.
          # `$state` and `$class` are gate-derived tokens from a closed vocabulary and `$failsafe` is
          # control-byte-stripped and length-bounded above; all are written with printf '%s' — never
          # interpolated as a workflow expression — and $GITHUB_STEP_SUMMARY is a markdown file this
          # step only appends to (no eval surface, no token use). Stack-neutral: POSIX sh only.
          {
            printf '%s\n' '### control-plane-ratification' ''
            printf -- '- **ratification state**: `%s`\n' "$state"
            printf -- '- **change-class (derived)**: `%s`\n' "$class"
            [ -z "$failsafe" ] || printf -- '- ⚠️ **change-class FAIL-SAFED, not derived**: %s\n' "$failsafe"
          } >> "$GITHUB_STEP_SUMMARY"
          # THE PROSE. The rc -> (title, summary) wording lives in conformance/agent-boundary.sh, where
          # it is --selftest-able; inline YAML cannot be unit-tested, and this wording is what replaces
          # the retired yellow. The script also emits status=/conclusion= lines; they are INERT here —
          # nothing is posted, so nothing consumes them.
          CI= sh conformance/agent-boundary.sh --conclusion "$rc" \
                --for-state "$state" --for-class "$class" > /tmp/mapping.txt
          title=""; summary=""
          while IFS='=' read -r k v; do
            case "$k" in
              title) title=$v ;;
              summary) summary=$v ;;
            esac
          done < /tmp/mapping.txt
          if [ -z "$title" ]; then
            echo "control-plane-ratification: the rc->wording map returned no title. The verdict is unaffected (it comes from the rc below), but the remedy text is missing — that is a gate defect worth fixing."
          fi
          # BOTH SURFACES: the log, and the step summary a reviewer reads before approving.
          {
            printf '%s\n' "$title"
            printf '%s\n' "$summary"
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          # NO `${VAR:-default}` ANYWHERE IN THIS STEP, not even in a log line: a default is how an
          # unset value stops looking unset, and one deciding the verdict is the fail-open this
          # rendering was reviewed for. An empty value prints empty and reaches the render mode's
          # `error` arm, which is the answer it should have.
          echo "control-plane-ratification => rc=$rc, class=$class, state=$state, approvals_seen=$APPROVALS_SEEN, reviews_readable=$REVIEWS_READABLE"
          # ★★ THE DECISION IS NOT MADE HERE. `conformance/agent-boundary.sh --render-exit` makes it —
          # a mode that is `--selftest`-driven over the whole state table — and this step OBEYS it.
          # That split is deliberate: inline YAML cannot be unit-tested, so a policy written here could
          # only ever be locked by its spelling, and an inverted arm that keeps every locked literal is
          # a real, measured mutant. This step's remaining logic: pass four values in, choose the
          # annotation text for the arm that comes back, exit on the number that comes back.
          # DO NOT RE-IMPLEMENT THE POLICY HERE.
          #
          # THE ARMS (contract in agent-boundary.sh's render_exit header):
          #   ratified  green — rc 0.
          #   waiting   green — rc 1, no approval seen, review list readable. The healthy state: your
          #             branch protection's "Require approvals >= 1" blocks the merge server-side, so
          #             this check explains rather than duplicates.
          #   defective RED   — an approval is present that does not ratify · the review list was
          #             UNREADABLE (which counts as 0 approvals and must NOT take the green arm) ·
          #             the change-class FAIL-SAFED instead of being derived.
          #   error     RED   — rc 2, or an input the render mode cannot trust.
          #
          # A FORK PR still gets a real verdict: a conclusion needs no token, whereas the check-run
          # poster this replaced could not post at all on a fork (read-only GITHUB_TOKEN).
          _fs=0
          [ -z "$failsafe" ] || _fs=1
          # ⚠️ VERSION SKEW: this job adjudicates from the BASE tree while the workflow comes from the
          # PR, so the checked-out agent-boundary.sh can lack a mode this file calls — normal during an
          # upgrade where profiles/ and conformance/ advance out of step. Unlike the other probed modes
          # this one cannot degrade to "unchecked": it IS the verdict, so its absence FAILS CLOSED, in
          # words. `false` (not `exit 1`) ends the step under `set -e`: the exit stays single-sourced.
          if grep -q -- '--render-exit' conformance/agent-boundary.sh 2>/dev/null; then
            CI= sh conformance/agent-boundary.sh --render-exit --rc "$rc" \
                  --approvals-seen "$APPROVALS_SEEN" --reviews-readable "$REVIEWS_READABLE" \
                  --failsafe "$_fs" > /tmp/render.txt
          else
            printf '::error title=control-plane-ratification: gate predates --render-exit::this checkout'\''s conformance/ predates the render mode (expected on the PR introducing it and during an adopter upgrade); the verdict could not be rendered — fail-closed\n'
            false
          fi
          cat /tmp/render.txt
          _exit=""; _arm=""
          while read -r _f1 _f2; do
            _exit=${_f1#exit=}
            _arm=${_f2#arm=}
          done < /tmp/render.txt
          # A MISSING OR UNRECOGNISED ARM IS NOT A GREEN — e.g. mid-upgrade, where the checked-out
          # conformance/ predates this mode. With no verdict to obey, supply the fail-closed one.
          case "$_arm" in
            ratified|waiting|defective|error) ;;
            # ⚠️ IT DOES NOT ASSIGN AN EXIT CODE. Even the fail-closed answer is asked of the single
            # source, by calling the mode with NO inputs — its contract defines that as
            # `exit=1 arm=error`. Writing `_exit=1` here would be this step deciding for itself again.
            # (If the mode is missing entirely — a checkout whose conformance/ predates it — the call
            # above already failed under `set -e` and the job is red before this line.)
            *) echo "control-plane-ratification: the render mode returned no usable arm. Asking it for its error verdict and failing closed."
               CI= sh conformance/agent-boundary.sh --render-exit > /tmp/render.txt
               cat /tmp/render.txt
               while read -r _f1 _f2; do
                 _exit=${_f1#exit=}
                 _arm=${_f2#arm=}
               done < /tmp/render.txt ;;
          esac
          # ★ THE ANNOTATION IS THE CHECKS-LIST SURFACE. A job shows only "control-plane-ratification —
          # failing/success"; the reason has to be an annotation to reach the top of the job page and
          # the Checks tab. SINGLE LINE — workflow commands are line-delimited, so a newline truncates
          # the message — bounded, and NO COMMA IN THE TITLE (annotation properties are
          # comma-separated, so a comma would end the title early).
          case "$_arm" in
            waiting)
              _wtitle='control-plane-ratification: awaiting a non-author approval'
              _wmsg='Your branch protection'\''s "Require approvals >= 1" is what blocks the merge until a human approves; this gate re-runs on the approval. Nothing is broken.'
              printf '::notice title=%s::%s\n' "$_wtitle" "$_wmsg"
              { printf -- '- **%s**\n' "$_wtitle"; printf -- '  %s\n' "$_wmsg"; } >> "$GITHUB_STEP_SUMMARY" ;;
            defective)
              _dmsg=$(printf '%s%s%s' \
                        "${failsafe:+change-class FAIL-SAFED: $failsafe. }" \
                        "$([ "$REVIEWS_READABLE" = 1 ] || printf 'the review list could not be read, so ratification could NOT be evaluated. ')" \
                        "$summary" | tr '\n\r\t' '   ' | cut -c1-400)
              # The title names ALL THREE routes into this arm: it is also reached with ZERO approvals
              # (unreadable review list, fail-safed class). NO COMMAS — annotation properties are
              # comma-separated, so a comma would truncate the title.
              printf '::error title=control-plane-ratification: not ratified — a human acted; the review list was unreadable; or the class fail-safed::%s\n' "$_dmsg" ;;
            error)
              _msg=$(printf '%s' "$summary" | tr '\n\r\t' '   ' | cut -c1-400)
              printf '::error title=control-plane-ratification: GATE ERROR — could not evaluate the control-plane diff::%s\n' "$_msg" ;;
          esac
          echo "control-plane-ratification => arm=$_arm, exit=$_exit"
          # THE EXIT IS THE VALUE THE RENDER MODE RETURNED, unconditionally and on its own line. No
          # `[ … ] || exit 1`: a comparison is a decision, and this step makes none.
          exit "$_exit"
