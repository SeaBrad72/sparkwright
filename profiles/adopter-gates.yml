# Reference ADOPTER-GATES workflow — the board/loop merge-time gates the kit uses on itself,
# ported for an adopted project: `backlog-presence` (a gated PR binds a board row), `ceremony-binding`
# (a gated PR carries a recorded design GO), and `loop-state` (the Entry-Declaration refusal floor —
# shipped ACTIVE but in OBSERVE mode; see the dial below). THE SINGLE, STACK-NEUTRAL SOURCE — like
# profiles/ratification.yml, this file runs no toolchain step, so it is identical for every stack and
# lives here once (a shared, non-stack asset), NOT once per profile. scripts/incept.sh installs it for
# EVERY stack, unconditionally; conformance/adopter-gates-parity.sh locks that it stays the sole,
# wired, stack-neutral copy.
# COPY & ADAPT: incept copies this file to your project's .github/workflows/adopter-gates.yml. It is
# INERT here in the kit repo (GitHub only runs workflows under .github/workflows/). The kit's own
# equivalents live in .github/workflows/ci.yml — this file is not dogfooded as a second copy (see the
# honest ceiling below).
#
# ⚠️ EVERY JOB KEY HERE IS A REQUIRED-CHECK NAME — DO NOT RENAME ONE (changed 2026-08-27).
# These gates used to compute a verdict and then POST it as a check-run through the API, from jobs
# whose keys deliberately DIFFERED from the check name (`gate-backlog-presence` + a `post-*` twin).
# That indirection existed to render a WAITING state YELLOW, which a workflow job cannot do. It broke:
# GitHub branch protection stopped MATCHING the posted runs, and PRs stranded at "Expected — waiting
# for status to be reported" with no way to clear them but an admin merge. A merge gate that
# intermittently cannot be satisfied teaches people to bypass it, which is worse than a coarse colour.
# So the posters are deleted. Each gate is now ONE REAL JOB whose key IS the required context and
# whose own conclusion IS the verdict — nothing to match up, and no `checks: write` anywhere in this
# file. Renaming a job key silently unbinds a required check; treat it as a branch-protection change.
#
# WAITING IS RED, AND THE CHECK SAYS SO IN WORDS. A job reports only success/failure/skipped/cancelled.
# So "no human has approved yet" reds, exactly like a broken build does — and the compensation is
# prose: every gate below prints, to the log AND the step summary, a title/summary stating plainly that
# this is NOT a build failure and naming the remedy. Tell your team once: on these checks, red means
# "read the title".
#
# HONEST CEILING — READ BEFORE TRUSTING A GREEN.
#   * This is REACH, not RUNTIME: conformance/adopter-gates-parity.sh proves the source is present,
#     marked, wired, stack-neutral and installed universally, and its behavioural incept witness
#     proves the file LANDS byte-identical for a real (non-typescript) stack. It does NOT re-run this
#     YAML on GitHub's own runners — the kit's own equivalents in .github/workflows/ci.yml are what
#     actually execute on every push, and this document's runtime greps + the incept witness are the
#     compensating proof, not a substitute for it.
#   * backlog-presence proves a board row's `PR` cell bears this PR's number or branch name as a whole
#     token — NOT that the row describes the work, that its state is accurate, or that a human put it
#     there.
#   * ceremony-binding is the BACKSTOP, not the control — it proves a `--gate design` GO record scoped
#     to this PR exists in refs/notes/promotions; the control is the human recording it. It presumes
#     the recording ceremony has been adopted (`scripts/promotion-verify.sh record`); until it has, a
#     gated PR waits (red, with the remedy in the title) and the check's own text names the record
#     command.
#   * loop-state (OBSERVE mode) is a nudge, not enforcement — see the dial below.
#
# ── THE loop-state OBSERVE/ENFORCE DIAL (Δ1, owner-ruled 2026-08-06) ──────────────────────────────
# Ported as-is, loop-state is a plain red ✗ on every adopter PR forever: no adopter commit carries
# Kit-* trailers on day one, and the declaration legs have no N/A route. A commented-out block was
# considered and rejected — the kit's own rollout doctrine is "observe-only first, then enforcing
# behind a flag" (the exact shape Slice B1 shipped for its own tree), and a dead comment never gets
# adopted. So this gate ships ACTIVE, gated on the single dial below:
#
#     LOOP_STATE_MODE: observe   (default — a NUDGE, never a block)
#     LOOP_STATE_MODE: enforce   (opt-in — the gate's REAL verdict; can BLOCK the merge)
#
# In `observe` mode the job RUNS THE GATE, PRINTS ITS VERDICT to the log and the step summary, and
# ALWAYS EXITS 0 — green, every time, whatever the gate found. That is the nudge: the finding is
# visible to anyone who opens the run, and nothing is blocked. (This replaces the earlier
# `conclusion: neutral` check-run, which is gone with the poster. Neutral and always-exit-0 are the
# same promise — non-blocking — reached without an API call.)
# ⚠️ THE OBSERVE-vs-BOUND INTERPLAY — READ THIS BEFORE ADDING `loop-state` TO REQUIRED-CHECKS.md.
# A job that always exits 0 SATISFIES a required check. So binding `loop-state` as a required context
# while this dial still reads `observe` is a SILENT PASS-THROUGH: every PR shows green on a context
# that is enforcing nothing. Flip the mode to `enforce` FIRST, then bind the context — never the other
# way around. In `enforce` mode the gate's own rc is the job's exit (0 pass · non-zero blocks).
name: Adopter Gates

on:
  pull_request:

permissions:
  contents: read

env:
  # THE DIAL. Change this one line to flip loop-state from a nudge to a merge-gate. See the header.
  LOOP_STATE_MODE: observe

jobs:
  # ── backlog-presence ────────────────────────────────────────────────────────────────────────────
  # A gated-change-class (control-plane / sensitive) PR must bind its number OR branch name to a row
  # on the project's BACKLOG.md `PR` column. First-run-green by construction: an ordinary PR, a
  # pristine template board, or an undeclared/non-md backend all N/A (conformance/backlog-presence.sh
  # decides — this workflow never re-derives that ladder).
  #
  # ⚠️ THE BASE-TREE CHECKOUT IS STILL LOAD-BEARING — do not "simplify" it into a plain PR checkout.
  # It once protected a `checks: write` token from PR-controlled code; that token is gone, but the
  # reason survives in a stronger form: THIS JOB'S EXIT CODE IS THE REQUIRED CONTEXT, so a PR that
  # could rewrite the script judging it could forge its own green. The shape is unchanged: the SCRIPT
  # comes from the BASE tree (the copy a human already ratified), the changed-file listing from the PR
  # files API, and BACKLOG.md + CLAUDE.md from the PR HEAD via the read-only Contents API — DATA, never
  # code. A forged board ROW is exactly as trustworthy as it always was (an author writes their own PR
  # number into their own board — the check's ceiling is unchanged), while the judging script is not
  # the PR's to change.
  backlog-presence:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read  # the PR files-API listing below 403s without this (probe #500, measured)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Compute changed files (from the PR files API — never from the PR's own tree)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Rename-safe (emits both filename + previous_filename) and newline-guarded — mirrors
          # profiles/ratification.yml's own listing step (T2). See that file for the full rationale.
          gh api "repos/${REPO}/pulls/${PR}/files" --paginate -q '[.[] | .filename, (.previous_filename // empty)] | if any(test("\n")) then error("changed path contains a newline byte — refusing to emit a splittable listing") else .[] end' > /tmp/changed.txt
          echo "backlog-presence: changed files seen by the gate:"
          cat /tmp/changed.txt
      - name: Fetch the board + backend declaration from the PR HEAD (data only — never executed)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The board row this PR is BINDING may exist ONLY at the PR head (P1-CI: a row bound by
          # branch name lands in the PR-opening commit, before any base-tree copy has it) — so the
          # board must be read from the HEAD, never the base. Fetched as DATA via the Contents API
          # (never checked out, never executed) so this job still runs no PR-controlled code. A 404
          # (file absent at head) is not an error — backlog-presence.sh's own N/A ladder handles a
          # missing board. ANY OTHER failure (rate limit, 5xx, auth) is NOT absence — see the next
          # step's escalation, which treats it as a gate error rather than "no board here".
          #
          # `?ref=${SHA}` as a QUERY PARAM, never `-f ref=`: `gh api` switches to POST the moment any
          # -f/-F flag is present, and POST against the read-only Contents endpoint 404s — that was
          # the bug (C-1/H-1: the board gate was permanently vacuous-green). `$f` is a fixed literal
          # from the loop below and `$SHA` is forge-hex, so both are URL-safe with no encoding step.
          # The `raw+json` media type returns the file's raw bytes directly (no base64 decode), and
          # it does not hit the Contents API's >1MB base64 field going silently empty — a second,
          # independent route to the same false "absent" this fix also closes.
          mkdir -p /tmp/board
          : > /tmp/board.err
          for f in BACKLOG.md CLAUDE.md; do
            err=$(gh api "repos/${REPO}/contents/${f}?ref=${SHA}" \
                    -H "Accept: application/vnd.github.raw+json" \
                    2>&1 >"/tmp/board/$f")
            fetch_rc=$?
            if [ "$fetch_rc" -eq 0 ]; then
              echo "backlog-presence: fetched $f from the PR head"
            else
              rm -f "/tmp/board/$f"
              if printf '%s' "$err" | grep -q 'HTTP 404'; then
                echo "backlog-presence: $f absent at the PR head (404) — N/A ladder handles this"
              else
                echo "backlog-presence: $f fetch FAILED (non-404, rc=$fetch_rc) — this is a gate error, not absence."
                printf '=== %s ===\n%s\n' "$f" "$err" >> /tmp/board.err
              fi
            fi
          done
      - name: Board-presence merge-gate — the gate's rc is this job's exit
        env:
          PR: ${{ github.event.pull_request.number }}
          # P1-CI: the BRANCH NAME exists BEFORE the PR is opened, so a row bound by branch can land
          # in the PR-opening commit. Untrusted (attacker-influenceable) — env-bound, passed by
          # ARGUMENT, never interpolated into the shell line.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set +e
          # Every real PR changes at least one file — an EMPTY listing means the gate could not SEE
          # the diff, not "nothing changed". Escalate to a gate error rather than reading it as N/A.
          if [ ! -s /tmp/changed.txt ]; then
            echo "backlog-presence: the changed-file listing is EMPTY. A pull request always changes at least one file, so this is a gate ERROR (the diff could not be computed). Escalating."
            rc=2
            out="backlog-presence: gate error — the changed-file listing came back empty; the diff could not be computed."
          elif [ -s /tmp/board.err ]; then
            # H-1: a non-404 board/backend fetch failure is NOT absence — the N/A ladder cannot be
            # trusted to have seen the real board. Escalate to the same gate-error path as an empty
            # diff (rc 2) rather than letting backlog-presence.sh read a missing file as N/A.
            echo "backlog-presence: the board/backend fetch hit a non-404 failure — cannot trust the N/A ladder. Escalating."
            rc=2
            out="$(printf 'backlog-presence: gate error — fetching BACKLOG.md/CLAUDE.md from the PR head failed (non-404). Fetch error(s):\n%s' "$(cat /tmp/board.err)")"
          else
            # VERSION SKEW: this job checks out the BASE tree, so the workflow can call a conformance
            # mode the checked-out script does not have yet — guaranteed on the PR introducing it, and
            # the normal upgrade path for an adopter whose profiles/ and conformance/ advance out of
            # step. Mirrors profiles/ratification.yml's own --check-complete skew guard.
            cap_rc=0
            if grep -q -- '--check-complete' conformance/agent-boundary.sh 2>/dev/null; then
              CI= sh conformance/agent-boundary.sh --check-complete --changed /tmp/changed.txt
              cap_rc=$?
            else
              echo "backlog-presence: this checkout's conformance/agent-boundary.sh predates --check-complete, so TRUNCATION IS UNCHECKED for this run. Expected during an upgrade where profiles/ and conformance/ advance out of step."
            fi
            if [ "$cap_rc" != 0 ]; then
              rc=2
              out="backlog-presence: gate error — the changed-file listing could not be verified COMPLETE (see the step above). An unverifiable change-set cannot be classified."
            else
              out=$(sh conformance/backlog-presence.sh --dir /tmp/board --pr "$PR" --changed /tmp/changed.txt --branch "$HEAD_REF" 2>&1); rc=$?
            fi
          fi
          set -e
          case "$rc" in
            0|1|2) ;;
            *) echo "backlog-presence: unexpected rc=$rc from the gate; reporting 2 (anomaly)."; rc=2 ;;
          esac
          # The WAITING/error PROSE comes from agent-boundary.sh's single-sourced, --selftest-able
          # wording. Only title=/summary= are read: its status=/conclusion= lines are INERT since the
          # posters were deleted (nothing is posted, so nothing consumes them). `backlog-presence` is
          # not a declared --for-gate token (that registry is kit-internal scope), so this takes the
          # GENERIC path — which is why the generic wording is LABELLED below and the actionable text
          # is the gate's own verdict ($out).
          title=""; summary=""
          CI= sh conformance/agent-boundary.sh --conclusion "$rc" --for-class control-plane > /tmp/bpmap.txt 2>/dev/null || true
          while IFS='=' read -r k v; do
            case "$k" in title) title=$v ;; summary) summary=$v ;; esac
          done < /tmp/bpmap.txt
          case "$rc" in
            0) head="backlog-presence: PASS — board row bound, or not required." ;;
            1) head="backlog-presence: WAITING — NOT a build failure, and no test failed. To proceed: add or update a BACKLOG.md row whose PR cell names this pull request (or its branch), then push." ;;
            *) head="backlog-presence: GATE ERROR or misconfiguration — board presence could not be adjudicated. This one IS a real error and needs fixing." ;;
          esac
          # ONE body, written to BOTH surfaces: the log and the step summary (what a reviewer reads
          # before approving). printf, never a multi-line assignment — a continuation line at column 0
          # would close this YAML block scalar.
          {
            printf '%s\n\n' "$head"
            printf '%s\n' "$out"
            [ "$rc" = 0 ] || printf '\n[generic mapping wording — this gate has no per-gate text; the actionable remedy is the line above]\n%s\n%s\n' "$title" "$summary"
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          # rc 0 -> green. rc 1 (WAITING) and rc 2 (error) both -> RED, because a job cannot be yellow.
          # The colour does not distinguish them; the first word of the title does.
          #
          # ★ AND AN ANNOTATION CARRIES THAT TITLE TO THE CHECKS LIST. A failed job renders there as
          # "backlog-presence — failing" and nothing else, so without this the WAITING-vs-BROKEN
          # distinction is invisible until someone opens the run. SINGLE LINE (workflow commands are
          # line-delimited, and $out is multi-line), bounded, and NO COMMA IN THE TITLE — annotation
          # properties are comma-separated.
          if [ "$rc" != 0 ]; then
            case "$rc" in
              1) _title='backlog-presence: WAITING — NOT a build failure'
                 _msg='To proceed: add or update a BACKLOG.md row whose PR cell names this pull request (or its branch) then push. No test failed and nothing is broken.' ;;
              *) _title='backlog-presence: GATE ERROR — board presence could not be adjudicated'
                 _msg=$(printf '%s' "$out" | tr '\n\r\t' '   ' | cut -c1-400) ;;
            esac
            printf '::error title=%s::%s\n' "$_title" "$_msg"
          fi
          # THE EXIT STAYS ON ITS OWN LINE — the kit's parity locks anchor this exact literal per job.
          [ "$rc" = 0 ] || exit 1

  # ── ceremony-binding ────────────────────────────────────────────────────────────────────────────
  # A Sensitive/Control-plane PR must carry a recorded `--gate design` GO scoped to this change.
  #
  # ONE JOB, KEYED `ceremony-binding` — and it holds NO TOKEN. This was a two-job split
  # (gate-ceremony-binding decides / post-ceremony-binding posts), and the split was a security
  # control: the deciding step executes conformance/ceremony-binding.sh FROM THE PR'S OWN TREE (it
  # needs the PR's commit trailers), so it could not be the job holding `checks: write`. With the
  # poster deleted there is no `checks: write` in this file at all, so the property is structural
  # rather than arranged. What survives is the credential drop below: PR-controlled code still runs
  # here, and it still must not run with a token in .git/config.
  ceremony-binding:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          # NO persist-credentials: false HERE — the notes fetch below runs AFTER checkout and needs
          # the persisted credential. It is removed EXPLICITLY at the end of that step, before any
          # PR-controlled code executes. See ci.yml's ceremony-binding for the measured reason.
      - name: Fetch the promotion GO ledger (refs/notes/promotions), then drop the credential
        run: |
          git fetch --no-tags origin '+refs/notes/*:refs/notes/*'
          git config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          if git config --local --get-all 'http.https://github.com/.extraheader' >/dev/null 2>&1; then
            echo "ceremony-binding: the checkout credential is STILL present after unset — refusing to run PR-controlled code with a token in .git/config."
            exit 1
          fi
          echo "ceremony-binding: GO ledger fetched; checkout credential removed."
      - name: DESIGN GATE binding (Sensitive/Control-plane change requires a recorded, scoped design GO)
        id: gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The SECOND scope key (BRANCH-SCOPE-END-TO-END Δ1, MIRRORED from ci.yml): a design GO is
          # recorded before the PR exists and carries `scope: branch/<name>` (D11), so matching that
          # key is what removes the PR-creation re-record. github.head_ref is AUTHOR-CONTROLLED —
          # bound through env, passed as an ARGUMENT, never interpolated into the shell.
          HEAD_REF: ${{ github.head_ref }}
          # Δ2 (fix round 1, MIRRORED from ci.yml) — the base the CONTAINMENT leg measures "already
          # integrated" against. Reachability alone does NOT close the reused-name class: once a
          # historic same-named branch is merged into the base its approved commit is on the
          # mainline and a new branch inherits it. Without this the gate discloses a reachable-only
          # run rather than refusing. Env-bound, passed as an ARGUMENT, never interpolated.
          BASE_REF: ${{ github.base_ref }}
        # THIS STEP exits 0 whatever the gate says, and that is a SEQUENCING choice, not a colour
        # choice: the render step below is load-bearing (the matched GO record must reach a reviewer's
        # field of view) and a red step here would be free to skip it. The rc is carried as this step's
        # output and the JOB ends on it in the Verdict step at the bottom.
        run: |
          set +e
          sh conformance/ceremony-binding.sh --scope "PR-$PR_NUMBER" --head-branch "$HEAD_REF" \
            --base-ref "$BASE_REF"
          rc=$?
          set -e
          case "$rc" in
            0|1|2) ;;
            *) echo "ceremony-binding: unexpected rc=$rc from the gate; reporting 2 (anomaly)."; rc=2 ;;
          esac
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "ceremony-binding => rc=$rc (0 pass/N-A · 1 WAITING, red-but-not-a-failure · 2 anomaly, red)"
      # B2 Δ4(ii) — the judgment-surface render, MIRRORED from ci.yml (reviewer I4: the gate shipped
      # to adopters without the visibility half of the disposition, which is the mirror-divergence
      # class B6 paid a Critical for). The GO record this merge rides on walks INTO the reviewer's
      # field of view on the run page BEFORE the click; WAITING/anomaly render one line each.
      # Detection at the judgment surface, not prevention — a note BINDS, it does not AUTHENTICATE.
      # ⚠️ THE RENDER'S BODY IS NO LONGER HERE — Δ3, BRANCH-SCOPE-END-TO-END (2026-08-11), MIRRORED
      # from ci.yml. It lived in THREE places (this step, ci.yml's, and the gate script's matcher)
      # and Δ1 adds a SECOND scope key; a copy left matching the PR key alone would render NOTHING
      # on exactly the PRs the branch key enables — the gate green, the reviewer clicking with no
      # record in view. The behaviour is single-sourced into `ceremony-binding.sh --render` and this
      # step INVOKES it. Every property is preserved IN THE SCRIPT: ALL matches (B7 rider), bodies
      # VERBATIM inside ONE GROWN FENCE (untrusted ledger content — a forged field closed a code
      # span and emitted `<br>` to render a second, stronger `approved-by` line, measured B2 sec
      # H2), and an 8 KB bound TOTAL across records with the cut ANNOUNCED (GitHub drops a whole
      # >1 MiB summary). DO NOT RE-INLINE ANY OF IT — conformance/adopter-gates-parity.sh refuses a
      # leg that regrows a copy or drops this invocation.
      # Nothing is `${{ }}`-interpolated into the script and the only sink is $GITHUB_STEP_SUMMARY
      # (a markdown file; this job holds no token). Stack-neutral: POSIX sh and git only. This step
      # never fails the build — the Verdict step after it does that, on the gate's rc.
      - name: Render the matched GO record into the step summary (the judgment surface)
        if: ${{ !cancelled() }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          GATE_RC: ${{ steps.gate.outputs.rc }}
        run: |
          case "$GATE_RC" in
            1) printf '%s\n' 'ceremony-binding: **WAITING** — no design-gate GO record scoped to this PR yet. This check will be RED and that is NOT a build failure: a human has not approved yet.' >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            2) printf '%s\n' 'ceremony-binding: **ANOMALY** — the gate could not evaluate, or the scoped record is defective (a real error; see the gate step log above).' >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            0) : ;;
            *) printf '%s\n' 'ceremony-binding: no usable gate rc reached the render step — nothing rendered (the Verdict step still ends the job on the rc).' >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
          esac
          # rc 0: the SAME two keys the gate matched on, from the SAME matcher.
          sh conformance/ceremony-binding.sh --render --scope "PR-$PR_NUMBER" --head-branch "$HEAD_REF" \
            >> "$GITHUB_STEP_SUMMARY"
      # ★ THE JOB ENDS HERE, ON THE GATE'S rc. This step replaces the deleted `post-ceremony-binding`
      # poster job. `!cancelled()`, not `always()`: a cancelled run must not manufacture a red verdict
      # for a run the operator themselves cancelled.
      - name: Verdict — the gate's rc is this job's exit (waiting reds, and says it is not a failure)
        if: ${{ !cancelled() }}
        env:
          GATE_RC: ${{ steps.gate.outputs.rc }}
        run: |
          # VALIDATE THE ONE VALUE THAT CROSSES A STEP BOUNDARY. An empty rc means the gate step died
          # before emitting one — a gate that could not evaluate, which is rc 2, not a silent pass.
          case "$GATE_RC" in
            0|1|2) rc=$GATE_RC ;;
            *) echo "ceremony-binding: the gate produced no usable rc ('$GATE_RC'); reporting 2."; rc=2 ;;
          esac
          # ceremony-binding IS a declared --for-gate token (unlike backlog-presence/loop-state, it
          # already ships in agent-boundary.sh's CONCLUSION_GATES) — so this genuinely can skew on an
          # OLDER checkout that predates --for-gate itself, which is why the guard below is a real
          # version probe, not a permanent fallback. Only title=/summary= are read; the script's
          # status=/conclusion= lines are inert now that nothing is posted.
          skew=""
          if grep -q -- '--for-gate' conformance/agent-boundary.sh 2>/dev/null; then
            CI= sh conformance/agent-boundary.sh --conclusion "$rc" \
                  --for-gate ceremony-binding --for-class control-plane > /tmp/cbmap.txt 2>/dev/null || true
          else
            skew=1
            echo "ceremony-binding: this checkout's conformance/agent-boundary.sh predates --for-gate, so the per-gate wording is unavailable for this run. The VERDICT is unaffected — it is computed from the gate's rc."
            CI= sh conformance/agent-boundary.sh --conclusion "$rc" \
                  --for-class control-plane > /tmp/cbmap.txt 2>/dev/null || true
          fi
          title=""; summary=""
          while IFS='=' read -r k v; do
            case "$k" in title) title=$v ;; summary) summary=$v ;; esac
          done < /tmp/cbmap.txt
          if [ -n "$skew" ]; then
            title="[generic wording — see summary] $title"
            summary="$(printf 'NOTE: the wording below is the generic ratification text — this run adjudicated with a conformance copy that predates per-gate wording, so ignore any instruction to seek a code approval. This is the DESIGN GATE: what it wants is a recorded design GO.\n\n%s' "$summary")"
          fi
          {
            printf '%s\n' "$title"
            printf '%s\n' "$summary"
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          # rc 0 -> green. rc 1 (WAITING on a human) and rc 2 (the gate broke) both -> RED, because a
          # job cannot be yellow. The title above is what separates them, in words.
          #
          # ★ AND THE ANNOTATION PUTS THAT TITLE WHERE IT IS SEEN — the checks list shows only
          # "ceremony-binding — failing" otherwise. SINGLE LINE (workflow commands are line-delimited),
          # bounded, NO COMMA IN THE TITLE (comma-separated property list).
          if [ "$rc" != 0 ]; then
            case "$rc" in
              1) _title='ceremony-binding: WAITING — NOT a build failure'
                 _msg='To proceed: record the scoped design GO (scripts/promotion-verify.sh record --gate design --scope PR-<n> ...) then `git push origin refs/notes/promotions` and RE-RUN this job — recording notes triggers no workflow on its own. No test failed.' ;;
              *) _title='ceremony-binding: GATE ERROR — the recorded GO is defective or the gate could not evaluate'
                 _msg=$(printf '%s' "$summary" | tr '\n\r\t' '   ' | cut -c1-400) ;;
            esac
            printf '::error title=%s::%s\n' "$_title" "$_msg"
          fi
          # THE EXIT STAYS ON ITS OWN LINE — the kit's parity locks anchor this exact literal per job.
          [ "$rc" = 0 ] || exit 1

  # ── loop-state (Δ1: ACTIVE, observe-mode dial) ─────────────────────────────────────────────────
  # The universal Entry-Declaration refusal floor — see the workflow header for the observe/enforce
  # dial. ONE JOB, keyed `loop-state`, holding no token: loop-state.sh reads the PR HEAD's commit
  # trailers (and, via promotion-readiness.sh --class, executes conformance/*.sh FROM THAT TREE), so
  # this job runs PR-controlled code — which is precisely why it must never hold a write scope. The
  # poster twin that used to hold one is deleted.
  loop-state:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The head SHA must be present as an object for `git log -1 <sha>` to read its trailers.
          fetch-depth: 0
          # This job needs no authenticated fetch (unlike ceremony-binding's notes pull) — so the
          # credential drops at checkout, before the PR-controlled loop-state.sh (and, via
          # promotion-readiness.sh --class, PR-tree conformance/*.sh) runs.
          persist-credentials: false
      - name: Entry Declaration on the PR head commit (row · stage · class · skill)
        id: gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          sh conformance/loop-state.sh --head "$HEAD_SHA"
          rc=$?
          set -e
          case "$rc" in
            0|1|2) ;;
            *) echo "loop-state: unexpected rc=$rc from the gate; reporting 2 (anomaly)."; rc=2 ;;
          esac
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "loop-state => rc=$rc (0 declaration present · 1 absent/invalid · 2 anomaly)"
      - name: Verdict — observe reports and passes, enforce exits on the gate's rc
        if: ${{ !cancelled() }}
        env:
          GATE_RC: ${{ steps.gate.outputs.rc }}
        run: |
          case "$GATE_RC" in
            0|1|2) rc=$GATE_RC ;;
            *) echo "loop-state: the gate produced no usable rc ('$GATE_RC'); reporting 2."; rc=2 ;;
          esac
          case "$rc" in
            0) reason="this commit already carries a valid Entry Declaration." ;;
            1) reason="this commit carries no Entry Declaration (or an invalid one)." ;;
            *) reason="the gate could not evaluate this commit (see the gate step log above)." ;;
          esac
          mode="${LOOP_STATE_MODE:-observe}"
          case "$mode" in
            enforce)
              title="loop-state: ENFORCE mode"
              summary="$(printf 'ENFORCE mode (LOOP_STATE_MODE: enforce): %s The gate rc is this job'"'"'s exit, so a missing or invalid Entry Declaration BLOCKS the merge. See the gate step log for the full verdict.' "$reason")"
              ;;
            *)
              title="loop-state: observe mode — not enforcing yet"
              summary="$(printf 'OBSERVE mode: %s Enforcement is OFF — this job ALWAYS exits 0, so this check can never block a merge while LOOP_STATE_MODE is observe. To enforce, IN THIS ORDER: (1) flip LOOP_STATE_MODE to enforce at the top of .github/workflows/adopter-gates.yml; (2) THEN declare loop-state as a required context in REQUIRED-CHECKS.md. Binding the context before flipping the mode gives a green that enforces nothing. (3) re-run this check.' "$reason")"
              ;;
          esac
          {
            printf '%s\n' "$title"
            printf '%s\n' "$summary"
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "loop-state => mode=$mode rc=$rc"
          # THE DIAL, expressed as the exit. observe: always 0 (a nudge — the finding is in the log and
          # the summary above, and nothing is blocked). enforce: the gate's own rc decides.
          #
          # ⚠️ NO ANNOTATION IN OBSERVE MODE, DELIBERATELY. `::error` renders as a red annotation on the
          # run even when the job exits 0, which would make a NUDGE look like a failure — the exact
          # cry-wolf this design is trying not to recreate. The observe verdict stays in the log and the
          # step summary; only an ENFORCING run, which actually blocks, annotates.
          [ "$mode" = enforce ] || exit 0
          if [ "$rc" != 0 ]; then
            case "$rc" in
              1) _title='loop-state: BLOCKING — no valid Entry Declaration on the head commit'
                 _msg='To proceed: add the Kit-Row / Kit-Stage / Kit-Class / Kit-Skill trailers as the LAST contiguous paragraph of the head commit message and push. LOOP_STATE_MODE is enforce so this blocks the merge.' ;;
              *) _title='loop-state: GATE ERROR — could not evaluate the head commit'
                 _msg=$(printf '%s' "$summary" | tr '\n\r\t' '   ' | cut -c1-400) ;;
            esac
            printf '::error title=%s::%s\n' "$_title" "$_msg"
          fi
          # THE EXIT STAYS ON ITS OWN LINE — the kit's parity locks anchor this exact literal per job.
          [ "$rc" = 0 ] || exit 1
