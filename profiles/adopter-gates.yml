# Reference ADOPTER-GATES workflow — the board/loop merge-time gates the kit uses on itself,
# ported for an adopted project: `backlog-presence` (a gated PR binds a board row), `ceremony-binding`
# (a gated PR carries a recorded design GO), and `loop-state` (the Entry-Declaration refusal floor —
# shipped ACTIVE but in OBSERVE mode; see the dial below). THE SINGLE, STACK-NEUTRAL SOURCE — like
# profiles/ratification.yml, this file runs no toolchain step, so it is identical for every stack and
# lives here once (a shared, non-stack asset), NOT once per profile. scripts/incept.sh installs it for
# EVERY stack, unconditionally; conformance/adopter-gates-parity.sh locks that it stays the sole,
# wired, stack-neutral copy.
# COPY & ADAPT: incept copies this file to your project's .github/workflows/adopter-gates.yml. It is
# INERT here in the kit repo (GitHub only runs workflows under .github/workflows/). The kit's own
# equivalents live in .github/workflows/ci.yml — this file is not dogfooded as a second copy (see the
# honest ceiling below).
#
# HONEST CEILING — READ BEFORE TRUSTING A GREEN.
#   * This is REACH, not RUNTIME: conformance/adopter-gates-parity.sh proves the source is present,
#     marked, wired, stack-neutral and installed universally, and its behavioural incept witness
#     proves the file LANDS byte-identical for a real (non-typescript) stack. It does NOT re-run this
#     YAML on GitHub's own runners — the kit's own equivalents in .github/workflows/ci.yml are what
#     actually execute on every push, and this document's runtime greps + the incept witness are the
#     compensating proof, not a substitute for it.
#   * backlog-presence proves a board row's `PR` cell bears this PR's number or branch name as a whole
#     token — NOT that the row describes the work, that its state is accurate, or that a human put it
#     there.
#   * ceremony-binding is the BACKSTOP, not the control — it proves a `--gate design` GO record scoped
#     to this PR exists in refs/notes/promotions; the control is the human recording it. It presumes
#     the recording ceremony has been adopted (`scripts/promotion-verify.sh record`); until it has, a
#     gated PR waits yellow and the check's own remedy text names the record command.
#   * loop-state (OBSERVE mode) is a nudge, not enforcement — see the dial below.
#
# ── THE loop-state OBSERVE/ENFORCE DIAL (Δ1, owner-ruled 2026-08-06) ──────────────────────────────
# Ported as-is, loop-state is a plain red ✗ on every adopter PR forever: no adopter commit carries
# Kit-* trailers on day one, and the declaration legs have no N/A route. A commented-out block was
# considered and rejected — the kit's own rollout doctrine is "observe-only first, then enforcing
# behind a flag" (the exact shape Slice B1 shipped for its own tree), and a dead comment never gets
# adopted. So this gate ships ACTIVE, gated on the single dial below:
#
#     LOOP_STATE_MODE: observe   (default — a NUDGE, never a block)
#     LOOP_STATE_MODE: enforce   (opt-in — posts the gate's REAL verdict; can BLOCK the merge)
#
# In `observe` mode the posted check-run's conclusion is `neutral` — a MEASURED choice (a dev-repo
# probe: draft PR #499, closed unmerged, branch deleted). Evidence: a `conclusion=neutral` check-run
# renders NEUTRAL in the GraphQL rollup and `skipping` in `gh pr checks` (never red/fail), and it is
# ABSENT from `required_status_checks` evaluation — structurally non-blocking when unbound. Two
# quirks the probe measured, disclosed here rather than assumed:
#   (1) the LEGACY `commits/<sha>/status` API is BLIND to check-runs (it will report state=pending,
#       count=0 for this context) — that is documented GitHub semantics, not a failure of this gate.
#   (2) an API-posted check-run may display under whichever workflow name GitHub happens to pick —
#       cosmetic; do not rely on a workflow/job NAME anywhere that matters, only the check-run NAME.
# ⚠️ THE OBSERVE-vs-BOUND INTERPLAY — READ THIS BEFORE ADDING `loop-state` TO REQUIRED-CHECKS.md.
# GitHub treats `neutral` as SATISFYING a required check. So binding `loop-state` as a required
# context while this dial still reads `observe` is a SILENT PASS-THROUGH: every PR shows green on a
# context that is enforcing nothing. Flip the mode to `enforce` FIRST, then bind the context — never
# the other way around. `enforce` mode posts the gate's real verdict (success / the WAITING yellow
# per loop-state.sh's own exit contract — never `neutral`).
name: Adopter Gates

on:
  pull_request:

permissions:
  contents: read

env:
  # THE DIAL. Change this one line to flip loop-state from a nudge to a merge-gate. See the header.
  LOOP_STATE_MODE: observe

jobs:
  # ── backlog-presence ────────────────────────────────────────────────────────────────────────────
  # A gated-change-class (control-plane / sensitive) PR must bind its number OR branch name to a row
  # on the project's BACKLOG.md `PR` column. First-run-green by construction: an ordinary PR, a
  # pristine template board, or an undeclared/non-md backend all N/A (conformance/backlog-presence.sh
  # decides — this workflow never re-derives that ladder).
  #
  # ONE JOB, DECIDE + POST TOGETHER — read this before "fixing" it into a two-job split.
  # ceremony-binding below is split because its GATE step executes conformance/ceremony-binding.sh
  # FROM THE PR'S OWN TREE (it needs the PR's commit trailers), and running PR-controlled CODE while
  # holding checks:write is the escalation agent-boundary.sh already locks against. This job never
  # does that: it checks out the BASE tree (the copy a human already ratified) for the SCRIPT, takes
  # the changed-file listing from the PR files API (untrusted DATA, never executed), and fetches
  # BACKLOG.md + CLAUDE.md from the PR HEAD via the read-only Contents API — DATA, not code, so a
  # forged board ROW is exactly as trustworthy as it always was (an author writes their own PR
  # number into their own board — the check's ceiling is unchanged), while the SCRIPT judging it
  # always remains the human-ratified base-tree copy. That is what makes a single job with
  # checks:write safe here, in contrast to ceremony-binding's split below.
  gate-backlog-presence:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read  # the PR files-API listing below 403s without this (probe #500, measured)
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Compute changed files (from the PR files API — never from the PR's own tree)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Rename-safe (emits both filename + previous_filename) and newline-guarded — mirrors
          # profiles/ratification.yml's own listing step (T2). See that file for the full rationale.
          gh api "repos/${REPO}/pulls/${PR}/files" --paginate -q '[.[] | .filename, (.previous_filename // empty)] | if any(test("\n")) then error("changed path contains a newline byte — refusing to emit a splittable listing") else .[] end' > /tmp/changed.txt
          echo "backlog-presence: changed files seen by the gate:"
          cat /tmp/changed.txt
      - name: Fetch the board + backend declaration from the PR HEAD (data only — never executed)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The board row this PR is BINDING may exist ONLY at the PR head (P1-CI: a row bound by
          # branch name lands in the PR-opening commit, before any base-tree copy has it) — so the
          # board must be read from the HEAD, never the base. Fetched as DATA via the Contents API
          # (never checked out, never executed) so the privileged job still runs no PR-controlled
          # code. A 404 (file absent at head) is not an error — backlog-presence.sh's own N/A ladder
          # handles a missing board. ANY OTHER failure (rate limit, 5xx, auth) is NOT absence — see
          # the next step's escalation, which treats it as a gate error rather than "no board here".
          #
          # `?ref=${SHA}` as a QUERY PARAM, never `-f ref=`: `gh api` switches to POST the moment any
          # -f/-F flag is present, and POST against the read-only Contents endpoint 404s — that was
          # the bug (C-1/H-1: the board gate was permanently vacuous-green). `$f` is a fixed literal
          # from the loop below and `$SHA` is forge-hex, so both are URL-safe with no encoding step.
          # The `raw+json` media type returns the file's raw bytes directly (no base64 decode), and
          # it does not hit the Contents API's >1MB base64 field going silently empty — a second,
          # independent route to the same false "absent" this fix also closes.
          mkdir -p /tmp/board
          : > /tmp/board.err
          for f in BACKLOG.md CLAUDE.md; do
            err=$(gh api "repos/${REPO}/contents/${f}?ref=${SHA}" \
                    -H "Accept: application/vnd.github.raw+json" \
                    2>&1 >"/tmp/board/$f")
            fetch_rc=$?
            if [ "$fetch_rc" -eq 0 ]; then
              echo "backlog-presence: fetched $f from the PR head"
            else
              rm -f "/tmp/board/$f"
              if printf '%s' "$err" | grep -q 'HTTP 404'; then
                echo "backlog-presence: $f absent at the PR head (404) — N/A ladder handles this"
              else
                echo "backlog-presence: $f fetch FAILED (non-404, rc=$fetch_rc) — this is a gate error, not absence."
                printf '=== %s ===\n%s\n' "$f" "$err" >> /tmp/board.err
              fi
            fi
          done
      - name: Board-presence merge-gate — colour-correct, never action_required
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          # P1-CI: the BRANCH NAME exists BEFORE the PR is opened, so a row bound by branch can land
          # in the PR-opening commit. Untrusted (attacker-influenceable) — env-bound, passed by
          # ARGUMENT, never interpolated into the shell line.
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set +e
          # Every real PR changes at least one file — an EMPTY listing means the gate could not SEE
          # the diff, not "nothing changed". Escalate to a gate error rather than reading it as N/A.
          if [ ! -s /tmp/changed.txt ]; then
            echo "backlog-presence: the changed-file listing is EMPTY. A pull request always changes at least one file, so this is a gate ERROR (the diff could not be computed). Escalating."
            rc=2
            out="backlog-presence: gate error — the changed-file listing came back empty; the diff could not be computed."
          elif [ -s /tmp/board.err ]; then
            # H-1: a non-404 board/backend fetch failure is NOT absence — the N/A ladder cannot be
            # trusted to have seen the real board. Escalate to the same gate-error path as an empty
            # diff (rc 2, ~:184) rather than letting backlog-presence.sh read a missing file as N/A.
            echo "backlog-presence: the board/backend fetch hit a non-404 failure — cannot trust the N/A ladder. Escalating."
            rc=2
            out="$(printf 'backlog-presence: gate error — fetching BACKLOG.md/CLAUDE.md from the PR head failed (non-404). Fetch error(s):\n%s' "$(cat /tmp/board.err)")"
          else
            # VERSION SKEW: this job checks out the BASE tree, so the workflow can call a conformance
            # mode the checked-out script does not have yet — guaranteed on the PR introducing it, and
            # the normal upgrade path for an adopter whose profiles/ and conformance/ advance out of
            # step. Mirrors profiles/ratification.yml's own --check-complete skew guard.
            cap_rc=0
            if grep -q -- '--check-complete' conformance/agent-boundary.sh 2>/dev/null; then
              CI= sh conformance/agent-boundary.sh --check-complete --changed /tmp/changed.txt
              cap_rc=$?
            else
              echo "backlog-presence: this checkout's conformance/agent-boundary.sh predates --check-complete, so TRUNCATION IS UNCHECKED for this run. Expected during an upgrade where profiles/ and conformance/ advance out of step."
            fi
            if [ "$cap_rc" != 0 ]; then
              rc=2
              out="backlog-presence: gate error — the changed-file listing could not be verified COMPLETE (see the step above). An unverifiable change-set cannot be classified."
            else
              out=$(sh conformance/backlog-presence.sh --dir /tmp/board --pr "$PR" --changed /tmp/changed.txt --branch "$HEAD_REF" 2>&1); rc=$?
            fi
          fi
          set -e
          # rc -> (status, conclusion) via agent-boundary.sh's single-sourced mapping — 0 success ·
          # 1 in_progress/no-conclusion (yellow, still blocking, NEVER action_required — the
          # B5a-measured kit-owned red is not exported to adopters) · 2 failure (a genuine gate error).
          # `backlog-presence` is not a declared --for-gate token (that registry is kit-internal
          # scope), so this ALWAYS takes the generic-mapping path — colour is correct regardless
          # (rc -> status/conclusion is single-sourced across every gate token); only the generic
          # PROSE is discarded below in favour of the gate's own verdict text ($out).
          CI= sh conformance/agent-boundary.sh --conclusion "$rc" --for-class control-plane > /tmp/bpmap.txt
          status=""; concl=""
          while IFS='=' read -r k v; do
            case "$k" in status) status=$v ;; conclusion) concl=$v ;; esac
          done < /tmp/bpmap.txt
          if [ -z "$status" ]; then
            echo "backlog-presence: the rc->check-run mapping returned no status. Refusing to post a check-run we cannot characterise — the required check stays ABSENT, which BLOCKS the merge (fail-closed)."
            exit 1
          fi
          case "$rc" in
            0) title="Board row bound — or not required" ;;
            1) title="Board row required — bind this PR to a backlog row (yellow, not a failure)" ;;
            *) title="Gate error or misconfiguration — board presence could not be adjudicated" ;;
          esac
          # PATCH-or-POST via a SERVER-SIDE ?check_name= filter (never a client-side select over an
          # unpaginated list — the ceremony-binding pair below explains why that misses on a re-run).
          # IDENTITY, NOT JUST PAGINATION (B5 Δ3): filter the name-scoped list down to OUR OWN prior
          # run by external_id — a same-named JOB auto-run or another workflow's poster must never be
          # PATCHed by us (Actions-stamped runs 403 our PATCH; measured 3x on the kit's probe #500,
          # where these very posters lost the timing race to a CI twin's job check-run). No own-run
          # match -> POST.
          set +e
          run_id=$(gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs?check_name=backlog-presence" \
                     -q '.check_runs[] | select(.external_id=="sparkwright-poster:backlog-presence") | .id' 2>/dev/null | head -1)
          if [ -n "$run_id" ]; then
            method=PATCH; endpoint="repos/${{ github.repository }}/check-runs/${run_id}"
          else
            method=POST;  endpoint="repos/${{ github.repository }}/check-runs"
          fi
          # the WAITING check-run OMITS conclusion (never sends an empty string — that would COMPLETE
          # the check-run, which is exactly the red this design removes).
          if [ -n "$concl" ]; then
            gh api -X "$method" "$endpoint" \
              -f name='backlog-presence' \
              -f external_id="sparkwright-poster:backlog-presence" \
              -f head_sha="$SHA" \
              -f status="$status" \
              -f conclusion="$concl" \
              -f 'output[title]'="$title" \
              -f 'output[summary]'="$out"
          else
            gh api -X "$method" "$endpoint" \
              -f name='backlog-presence' \
              -f external_id="sparkwright-poster:backlog-presence" \
              -f head_sha="$SHA" \
              -f status="$status" \
              -f 'output[title]'="$title" \
              -f 'output[summary]'="$out"
          fi
          api_rc=$?
          set -e
          echo "backlog-presence => status=$status conclusion=${concl:-<none: waiting>} (rc=$rc, api_rc=$api_rc)"
          if [ "$api_rc" -ne 0 ]; then
            echo "backlog-presence: the check-run could not be posted (gh api rc=$api_rc). On a fork pull_request this is EXPECTED — the token is read-only, so the required 'backlog-presence' check simply never posts, which BLOCKS the merge rather than allowing it (fail-closed)."
            if [ "$HEAD_REPO" = "$THIS_REPO" ]; then
              echo "backlog-presence: this is a SAME-REPO pull request, so the token should have been writable. Failing the job — an unreportable gate is a real defect, not a fork's read-only token."
              exit 1
            fi
          fi
          # The job exits 0 in the common case — no failure email; the check-run carries the verdict.
          # The one exception is the same-repo unreportable case above, which fails the job on purpose.

  # ── ceremony-binding ────────────────────────────────────────────────────────────────────────────
  # A Sensitive/Control-plane PR must carry a recorded `--gate design` GO scoped to this change.
  # TWO JOBS, AND THE SPLIT IS A SECURITY CONTROL (ported verbatim from .github/workflows/ci.yml's
  # own pair — see that file for the full rationale this header only summarizes):
  #   * gate-ceremony-binding DECIDES. It executes conformance/ceremony-binding.sh from the PR's OWN
  #     tree (it needs the PR's commit trailers), so it holds NO checks:write — only contents: read —
  #     and drops even the checkout credential before running any PR-controlled code.
  #   * post-ceremony-binding POSTS. It holds checks: write, but checks out the BASE tree (the copy a
  #     human already ratified) and never the PR's own code; only a single validated DIGIT (the rc)
  #     crosses the job boundary — never the gate's own verdict TEXT, which is PR-influenced.
  gate-ceremony-binding:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    outputs:
      rc: ${{ steps.gate.outputs.rc }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          # NO persist-credentials: false HERE — the notes fetch below runs AFTER checkout and needs
          # the persisted credential. It is removed EXPLICITLY at the end of that step, before any
          # PR-controlled code executes. See ci.yml's gate-ceremony-binding for the measured reason.
      - name: Fetch the promotion GO ledger (refs/notes/promotions), then drop the credential
        run: |
          git fetch --no-tags origin '+refs/notes/*:refs/notes/*'
          git config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          if git config --local --get-all 'http.https://github.com/.extraheader' >/dev/null 2>&1; then
            echo "gate-ceremony-binding: the checkout credential is STILL present after unset — refusing to run PR-controlled code with a token in .git/config."
            exit 1
          fi
          echo "gate-ceremony-binding: GO ledger fetched; checkout credential removed."
      - name: DESIGN GATE binding (Sensitive/Control-plane change requires a recorded, scoped design GO)
        id: gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          sh conformance/ceremony-binding.sh --scope "PR-$PR_NUMBER"
          rc=$?
          set -e
          case "$rc" in
            0|1|2) ;;
            *) echo "ceremony-binding: unexpected rc=$rc from the gate; reporting 2 (anomaly)."; rc=2 ;;
          esac
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "ceremony-binding => rc=$rc (0 pass/N-A · 1 WAITING, yellow · 2 anomaly, red)"
      # B2 Δ4(ii) — the judgment-surface render, MIRRORED from ci.yml (reviewer I4: the gate shipped
      # to adopters without the visibility half of the disposition, which is the mirror-divergence
      # class B6 paid a Critical for). The GO record this merge rides on walks INTO the reviewer's
      # field of view on the run page BEFORE the click; WAITING/anomaly render one line each.
      # Detection at the judgment surface, not prevention — a note BINDS, it does not AUTHENTICATE.
      # UNTRUSTED DATA: the record is ledger content (anyone with push can write notes), so the body
      # is emitted VERBATIM inside a FENCE whose length is grown until the body cannot contain it —
      # never as per-field markdown, which a forged field defeated by closing a code span and
      # emitting `<br>` (measured, B2 sec H2). Nothing is `${{ }}`-interpolated into the script and
      # the only sink is $GITHUB_STEP_SUMMARY (a markdown file; this job holds no token).
      # Stack-neutral: POSIX sh and git only. This step never fails the build.
      - name: Render the matched GO record into the step summary (the judgment surface)
        if: ${{ !cancelled() }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_RC: ${{ steps.gate.outputs.rc }}
        run: |
          NOTES_REF="${PROMOTION_NOTES_REF:-promotions}"
          case "$GATE_RC" in
            1) printf '%s\n' 'ceremony-binding: **WAITING** — no design-gate GO record scoped to this PR yet (yellow; a human has not approved yet).' >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            2) printf '%s\n' 'ceremony-binding: **ANOMALY** — the gate could not evaluate, or the scoped record is defective (red; see the gate step log above).' >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            0) : ;;
            *) printf '%s\n' 'ceremony-binding: no usable gate rc reached the render step — nothing rendered (the check-run still carries the verdict).' >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
          esac
          # B7 rider — render EVERY scope-matching record (MIRRORED from ci.yml, parity case 9):
          # the gate adjudicates all matches and passes if ANY survives, so rendering only the
          # first could show a DEFECTIVE record while the gate passed on a valid sibling — a
          # D-240805-4 visibility lie. One fence, per-record separators; the 8 KB bound below is
          # TOTAL across records (finding 4).
          nl=$(printf '\nX'); nl=${nl%X}   # a literal newline, without breaking the YAML block indent
          body=''; matched=0
          if git rev-parse -q --verify "refs/notes/$NOTES_REF" >/dev/null 2>&1; then
            for obj in $(git notes --ref="$NOTES_REF" list 2>/dev/null | awk '{print $2}'); do
              b="$(git notes --ref="$NOTES_REF" show "$obj" 2>/dev/null || true)"
              printf '%s\n' "$b" | grep -q '^gate: design$' || continue
              printf '%s\n' "$b" | grep -qF -x "scope: PR-$PR_NUMBER" || continue
              matched=$((matched + 1))
              if [ -z "$body" ]; then
                body="--- record $obj ---${nl}${b}"
              else
                body="${body}${nl}--- record $obj ---${nl}${b}"
              fi
            done
          fi
          if [ -z "$body" ]; then
            printf '%s\n' 'ceremony-binding: PASS/N-A with no scoped design record (ordinary change-class) — nothing to render.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # SIZE BOUND [B2 round-2, security M-new-1] — MIRRORED from ci.yml. GitHub caps
          # $GITHUB_STEP_SUMMARY at 1 MiB and DROPS THE WHOLE SUMMARY past it; one forged field
          # measured 1,601,670 bytes, i.e. the gate posts PASS and the reviewer clicks with NO record
          # rendered — the "hide the record" outcome by VOLUME. Truncate to 8 KB and ANNOUNCE the cut
          # (silent truncation hides it just as well). awk, not `head -c`: `printf | head -c`
          # SIGPIPEs the writer, which under `-o pipefail` would abort the render entirely.
          truncated=0
          if [ "$(printf '%s' "$body" | LC_ALL=C wc -c | tr -d ' ')" -gt 8192 ]; then
            body=$(printf '%s\n' "$body" | LC_ALL=C awk -v max=8192 '
              used < max {
                if (used + length($0) + 1 > max) { printf "%s", substr($0, 1, max - used); exit }
                print $0; used += length($0) + 1
              }')
            truncated=1
          fi
          # FENCE-IN-BODY GUARD, one awk pass: the fence must be LONGER than the longest backtick RUN
          # so no ledger content can close it. The grow-and-rescan loop it replaces forked `grep` per
          # backtick over author-controlled input (measured 9s on a 2,000-backtick body). Fail-safe:
          # an unusable run length yields the LONGEST fence, never a short one.
          run=$(printf '%s\n' "$body" | LC_ALL=C awk '
            { n = 0
              for (i = 1; i <= length($0); i++) {
                if (substr($0, i, 1) == "`") { n++; if (n > m) m = n } else { n = 0 }
              } }
            END { print m + 0 }')
          case "$run" in ''|*[!0-9]*) run=8192 ;; esac
          fence='```'
          while [ "${#fence}" -le "$run" ]; do fence="$fence"'`'; done
          {
            printf '%s\n' "## ceremony-binding — the design-gate GO record(s) this merge rides on ($matched matched, rendered up to the 8 KB total bound)" ''
            printf '%s\n' "$fence" "$body" "$fence"
            if [ "$truncated" = 1 ]; then
              printf '%s\n' '' "**(truncated at 8 KB TOTAL across all $matched record(s) — read the full ledger: \`git notes --ref=$NOTES_REF show <sha>\`)**"
            fi
            printf '%s\n' '' '_Every record above is reproduced VERBATIM from the ledger, inside one code fence: nothing in it renders as markdown, so a field cannot forge a second one. The gate passes if ANY matching record survives adjudication — a defective sibling is SHOWN here, not hidden behind the survivor, within the 8 KB total bound; past it, the cut is announced and the ledger command shows the rest. Record bodies can contain separator-lookalike text; the header'"'"'s matched-count is authoritative. A note **binds**, it does not **authenticate**._'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ceremony-binding: $matched matched record(s) rendered into the step summary."

  post-ceremony-binding:
    needs: gate-ceremony-binding
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Post the ceremony-binding check-run (waiting is yellow, not red)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RC_IN: ${{ needs.gate-ceremony-binding.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          case "$RC_IN" in
            0|1|2) rc=$RC_IN ;;
            *) echo "ceremony-binding: the gate produced no usable rc ('$RC_IN'); reporting 2."; rc=2 ;;
          esac
          # ceremony-binding IS a declared --for-gate token (unlike backlog-presence/loop-state, it
          # already ships in agent-boundary.sh's CONCLUSION_GATES) — so this genuinely can skew on an
          # OLDER checkout that predates --for-gate itself, which is why the guard below is a real
          # version probe, not a permanent fallback.
          skew=""
          if grep -q -- '--for-gate' conformance/agent-boundary.sh 2>/dev/null; then
            CI= sh conformance/agent-boundary.sh --conclusion "$rc" \
                  --for-gate ceremony-binding --for-class control-plane > /tmp/cbmap.txt
          else
            skew=1
            echo "ceremony-binding: this checkout's conformance/agent-boundary.sh predates --for-gate, so the per-gate wording is unavailable for this run. The COLOUR is unaffected — rc -> (status, conclusion) is single-sourced and identical across gates."
            CI= sh conformance/agent-boundary.sh --conclusion "$rc" \
                  --for-class control-plane > /tmp/cbmap.txt
          fi
          status=""; concl=""; title=""; summary=""
          while IFS='=' read -r k v; do
            case "$k" in
              status) status=$v ;;
              conclusion) concl=$v ;;
              title) title=$v ;;
              summary) summary=$v ;;
            esac
          done < /tmp/cbmap.txt
          if [ -z "$status" ]; then
            echo "ceremony-binding: the rc->check-run mapping returned no status. Refusing to post a check-run we cannot characterise — the required check stays ABSENT, which BLOCKS the merge (fail-closed)."
            exit 1
          fi
          summary="$(printf '%s\n\nGate log: %s' "$summary" "$RUN_URL")"
          if [ -n "$skew" ]; then
            title="[generic wording — see summary] $title"
            summary="$(printf 'NOTE: the wording below is the generic ratification text — this run adjudicated from a base tree that predates per-gate wording, so ignore any instruction to seek a code approval. This is the DESIGN GATE: what it wants is a recorded design GO. The colour is correct.\n\n%s' "$summary")"
          fi
          set +e
          # IDENTITY, NOT JUST PAGINATION (B5 Δ3): own-run lookup by external_id over the name-scoped
          # list; a same-named JOB auto-run or another workflow's poster is never PATCHed by us.
          run_id=$(gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs?check_name=ceremony-binding" \
                     -q '.check_runs[] | select(.external_id=="sparkwright-poster:ceremony-binding") | .id' 2>/dev/null | head -1)
          if [ -n "$run_id" ]; then
            method=PATCH; endpoint="repos/${{ github.repository }}/check-runs/${run_id}"
          else
            method=POST;  endpoint="repos/${{ github.repository }}/check-runs"
          fi
          # the WAITING check-run OMITS conclusion (never sends an empty string — that would COMPLETE
          # the check-run, which is exactly the red this design removes).
          if [ -n "$concl" ]; then
            gh api -X "$method" "$endpoint" \
              -f name='ceremony-binding' \
              -f external_id="sparkwright-poster:ceremony-binding" \
              -f head_sha="$SHA" \
              -f status="$status" \
              -f conclusion="$concl" \
              -f 'output[title]'="$title" \
              -f 'output[summary]'="$summary"
          else
            gh api -X "$method" "$endpoint" \
              -f name='ceremony-binding' \
              -f external_id="sparkwright-poster:ceremony-binding" \
              -f head_sha="$SHA" \
              -f status="$status" \
              -f 'output[title]'="$title" \
              -f 'output[summary]'="$summary"
          fi
          api_rc=$?
          set -e
          echo "ceremony-binding => status=$status conclusion=${concl:-<none: waiting on a human>} (rc=$rc, api_rc=$api_rc)"
          if [ "$api_rc" -ne 0 ]; then
            echo "ceremony-binding: the check-run could not be posted (gh api rc=$api_rc). On a fork pull_request this is EXPECTED (read-only token) and the merge stays BLOCKED by the absent context."
            if [ "$HEAD_REPO" = "$THIS_REPO" ]; then
              echo "ceremony-binding: this is a SAME-REPO pull request, so the token should have been writable. Failing the job — an unreportable gate is a real defect, not a fork's read-only token."
              exit 1
            fi
          fi

  # ── loop-state (Δ1: ACTIVE, observe-mode dial) ─────────────────────────────────────────────────
  # The universal Entry-Declaration refusal floor — see the workflow header for the observe/enforce
  # dial and the measured `neutral` rationale. TWO JOBS, same split rationale as ceremony-binding
  # above: loop-state.sh reads the PR HEAD's commit trailers (and, via promotion-readiness.sh --class,
  # executes conformance/*.sh FROM THAT TREE), so the deciding job holds no checks:write.
  gate-loop-state:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    outputs:
      rc: ${{ steps.gate.outputs.rc }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The head SHA must be present as an object for `git log -1 <sha>` to read its trailers.
          fetch-depth: 0
          # This job holds no checks:write and needs no further authenticated fetch (unlike
          # gate-ceremony-binding's notes pull) — so the credential drops at checkout, before the
          # PR-controlled loop-state.sh (and, via promotion-readiness.sh --class, PR-tree
          # conformance/*.sh) runs. M-1: the kit's own ci.yml carries the same gap, boarded separately.
          persist-credentials: false
      - name: Entry Declaration on the PR head commit (row · stage · class · skill)
        id: gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          sh conformance/loop-state.sh --head "$HEAD_SHA"
          rc=$?
          set -e
          case "$rc" in
            0|1|2) ;;
            *) echo "loop-state: unexpected rc=$rc from the gate; reporting 2 (anomaly)."; rc=2 ;;
          esac
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "loop-state => rc=$rc (0 declaration present · 1 absent/invalid · 2 anomaly)"

  post-loop-state:
    needs: gate-loop-state
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Post the loop-state check-run — observe is neutral, enforce is the real verdict
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RC_IN: ${{ needs.gate-loop-state.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          case "$RC_IN" in
            0|1|2) rc=$RC_IN ;;
            *) echo "loop-state: the gate produced no usable rc ('$RC_IN'); reporting 2."; rc=2 ;;
          esac
          case "${LOOP_STATE_MODE:-observe}" in
            enforce)
              # loop-state is not a declared --for-gate token (kit-internal registry scope) — always
              # the generic-mapping path; colour is correct regardless (single-sourced across gates).
              CI= sh conformance/agent-boundary.sh --conclusion "$rc" --for-class control-plane > /tmp/lsmap.txt
              status=""; concl=""
              while IFS='=' read -r k v; do
                case "$k" in status) status=$v ;; conclusion) concl=$v ;; esac
              done < /tmp/lsmap.txt
              case "$rc" in
                0) title="Entry Declaration present — loop-state satisfied" ;;
                1) title="Entry Declaration missing or invalid — enforce mode is BLOCKING this merge" ;;
                *) title="loop-state gate error — could not evaluate the head commit" ;;
              esac
              summary="$(printf 'loop-state is in ENFORCE mode (LOOP_STATE_MODE: enforce). See the gate log for the full Entry-Declaration verdict.\n\nGate log: %s' "$RUN_URL")"
              ;;
            *)
              # OBSERVE (the default). ALWAYS neutral, regardless of rc — a measured, non-red,
              # non-blocking colour (see the workflow header). status is always "completed" for a
              # neutral conclusion.
              status="completed"; concl="neutral"
              title="loop-state: observe mode — not enforcing yet"
              case "$rc" in
                0) reason="this commit already carries a valid Entry Declaration." ;;
                1) reason="this commit carries no Entry Declaration (or an invalid one)." ;;
                *) reason="the gate could not evaluate this commit (see the log)." ;;
              esac
              summary="$(printf 'OBSERVE mode: %s Enforcement is OFF — this check can never block a merge while LOOP_STATE_MODE is observe. To enforce, IN THIS ORDER: (1) flip LOOP_STATE_MODE to enforce at the top of .github/workflows/adopter-gates.yml; (2) THEN declare loop-state as a required context in REQUIRED-CHECKS.md. Binding the context before flipping the mode gives a green-equivalent (GitHub treats neutral as satisfying a required check) that enforces nothing. (3) re-run this check.\n\nGate log: %s' "$reason" "$RUN_URL")"
              ;;
          esac
          if [ -z "$status" ]; then
            echo "loop-state: refusing to post a check-run we cannot characterise — the required check stays ABSENT, which BLOCKS the merge if bound (fail-closed)."
            exit 1
          fi
          set +e
          # IDENTITY, NOT JUST PAGINATION (B5 Δ3): own-run lookup by external_id over the name-scoped
          # list. On the kit's own dev repo this poster lost the find-by-name race to ci.yml's
          # `loop-state` JOB check-run 3x on probe #500 (Feb-2025 PATCH 403, post-loop-state red) —
          # the external_id filter is what makes dogfooding these gates beside an internal CI possible.
          run_id=$(gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs?check_name=loop-state" \
                     -q '.check_runs[] | select(.external_id=="sparkwright-poster:loop-state") | .id' 2>/dev/null | head -1)
          if [ -n "$run_id" ]; then
            method=PATCH; endpoint="repos/${{ github.repository }}/check-runs/${run_id}"
          else
            method=POST;  endpoint="repos/${{ github.repository }}/check-runs"
          fi
          # the WAITING check-run OMITS conclusion (never sends an empty string — that would COMPLETE
          # the check-run, which is exactly the red this design removes).
          if [ -n "$concl" ]; then
            gh api -X "$method" "$endpoint" \
              -f name='loop-state' \
              -f external_id="sparkwright-poster:loop-state" \
              -f head_sha="$SHA" \
              -f status="$status" \
              -f conclusion="$concl" \
              -f 'output[title]'="$title" \
              -f 'output[summary]'="$summary"
          else
            gh api -X "$method" "$endpoint" \
              -f name='loop-state' \
              -f external_id="sparkwright-poster:loop-state" \
              -f head_sha="$SHA" \
              -f status="$status" \
              -f 'output[title]'="$title" \
              -f 'output[summary]'="$summary"
          fi
          api_rc=$?
          set -e
          echo "loop-state => mode=${LOOP_STATE_MODE:-observe} status=$status conclusion=${concl:-<none: waiting>} (rc=$rc, api_rc=$api_rc)"
          if [ "$api_rc" -ne 0 ]; then
            echo "loop-state: the check-run could not be posted (gh api rc=$api_rc). On a fork pull_request this is EXPECTED (read-only token)."
            if [ "$HEAD_REPO" = "$THIS_REPO" ]; then
              echo "loop-state: this is a SAME-REPO pull request, so the token should have been writable. Failing the job — an unreportable gate is a real defect, not a fork's read-only token."
              exit 1
            fi
          fi
