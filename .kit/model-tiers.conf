# .kit/model-tiers.conf — model-tiering policy (CONTROL-PLANE: pins are a ratified posture).
# "tier" = MODEL tier, NOT the autonomy/promotion tier (scripts/tier-advice.sh, DEV-PROCESS §13).
# SWAS-303a (D-241018-2): the tokens below name what a seat needs, NOT a quality rank. The resolver still
# orders them until 303b (it keeps a top tier, forces --critical-path to it, and reads an unknown change-class
# as top): a known issue, listed in the CHANGELOG. Which model serves a tier is the project's call, recorded in
# .kit/model-map.conf.
# Values are comma-separated, NO spaces (the cfg() parser stops at the first whitespace).
TIERS=apex,deep,fast,light
# Pinned seats — no dispatch-time request may move one off its mapped tier; only a recorded mapping decision can
# (a change-control property, not a quality one). Architect/plan may still be RAISED to the opt-in `apex` tier
# below; that is an upgrade, not a downgrade, so the pin governance holds.
PIN=orchestrator,reviewer,security,architect,plan,verification
# APEX-eligible seats — the ONLY seats that may be RAISED to the opt-in `apex` tier, on the human's explicit ask for
# one task (owner-ratified 2026-07-23, kept). reviewer/security/orchestrator/verification are absent by design.
APEX_ELIGIBLE=engineer,architect,plan
# Variable seats — may run a requested tier within ALLOWED_<role>.
VARIABLE=engineer,explorer
ALLOWED_engineer=deep,fast
ALLOWED_explorer=deep,fast,light
DEFAULT_engineer=fast
DEFAULT_explorer=fast
# The full set of VALID change-classes (promotion-contract: ordinary/sensitive/control-plane).
# The resolver normalizes --change-class (trim+lowercase); a NON-EMPTY value that is not one of these
# is treated as top-tier (fail-safe) until 303b.
CHANGE_CLASSES=ordinary,sensitive,control-plane
# The change-class floor is RETIRED as a kit default (D-241018-2 supersedes clause D1 of the 2026-07-23 apex-tier ruling). A project
# that wants a class floor lists the class here and records why (per-class overrides in the map arrive in 303b);
# the kit ships none.
FLOOR_CHANGE_CLASS=
