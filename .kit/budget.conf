# .kit/budget.conf — E4d runaway ceilings (CONTROL-PLANE: raising a ceiling is a ratified act).
# A dimension is DISABLED when its value is 0. Tune to your run profile; see docs/operations/runaway-killswitch.md.
# THE BUDGET IS PER SLICE (row), RUNAWAY-CEILING-PER-SLICE. Every `runaway-guard.sh step` names its row;
# each row is graded ALONE against the base ceilings below, and a new row starts at zero (`reset` is retired).
# The tally is per REPO, at $HOME/.local/state/sparkwright/runaway/<root-commit>/tally.v2, shared by every
# worktree and session of the repo. A raise is ONE uncommitted line naming its row, ratified by the owner:
#   RAISE <ROW> MAX_TOKENS=<n> MAX_AGENTS=<n> MAX_STEPS=<n>   (any subset, at least one key; an unknown key is rc 2)
# It lifts that row only. A COMMITTED RAISE IS A DEFECT: a raise that outlives its row is a control failure.
# An edited base MAX_* (bytes differing from the committed copy) is still honoured, but WARNs on every step
# and check as an "unscoped raise" — scope a raise with a RAISE line instead. MAX_STEPS is 0 (disabled) by
# default: a step count is not a per-slice signal.
# The history of this file's ceilings lives in git and the kit's own review records, which are not part of the adopter export.
MAX_TOKENS=10000000
MAX_STEPS=0
MAX_AGENTS=40
WARN_PCT=80
COST_PER_1K_USD=0.003
# MAX_WIP — how many slices this repo may have CLAIMED at once (refs/claims/* on origin), enforced by
# scripts/board-claim.sh at claim time via `runaway-guard.sh wip --count <n>`. 0 or absent = disabled
# (an adopter without this key keeps `claim` working). Two concurrent sessions is the tested width;
# raising it is a ratified act like every other ceiling here.
MAX_WIP=2
