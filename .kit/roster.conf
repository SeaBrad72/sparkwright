# Roster-authority guard dial (Slice B). See docs/adoption/skill-rosters.md.
# MODE: off (default) | ask | deny. Override per-session with KIT_ROSTER_GUARD.
MODE=off
# Space-separated process-library namespaces the kit prefers its own roster over.
BLOCKLIST=superpowers

# ---------------------------------------------------------------------------
# STAGE -> SKILL MAP  (read by conformance/loop-state.sh; KIT-ADHERENCE-ENFORCEMENT B1)
#
# THIS IS THE SINGLE AUTHORITY for two things:
#   1. which loop stages exist — the valid Kit-Stage set is DERIVED from KIT_STAGES below;
#      loop-state.sh does NOT hardcode a stage list; and
#   2. which skills may govern each stage.
#
# It lives here rather than in the gate on purpose (design section 3.0, Security N1 - High): a
# hardcoded map would make loop-state.sh a 14th site enumerating the roster, and an unmapped
# pair would fall through to PASS. loop-state.sh PARSES this file; it does not source it, so a
# conf file never becomes executable code reachable from a gate.
#
# COMPLETENESS IS LOCKED IN BOTH DRIFT DIRECTIONS. Each of these is a FAIL, never a fall-through:
#   (a) a skill on disk absent from the map
#   (b) a map entry naming no skill on disk
#   (c) a stage in KIT_STAGES with no skill set
#
# The map is MANY-TO-MANY, deliberately:
#   * a stage may have several governing skills - Plan holds BOTH design and plan; and
#   * a skill may govern several stages - verification governs Review, Release and Done.
#   A one-to-one map would force a false choice and fail legitimate work.
#
# `using-skills` appears in EVERY stage: it is the discovery keystone, invoked at the start of
# any task regardless of stage. Excluding it would also break the completeness lock (a).
#
# DESIGN IS A GATE INSIDE PLAN, NOT A STAGE (owner-ratified 2026-07-27). skills/design maps to
# Plan, whose exit is the human Spec gate. Promoting Design to its own stage is boarded for V2
# as DESIGN-AS-A-STAGE - and because the stage set is derived from KIT_STAGES, doing so is a
# data change here rather than a code change in the gate.
#
# The seven stages are authoritative per DEVELOPMENT-PROCESS.md:63,455 and the stage table at
# :106-114. Four other carriers currently render six and the A1 design rendered five; that is
# boarded as LOOP-STAGE-ENUM-DRIFT. Do NOT "correct" this list to match a six-stage carrier.
# ---------------------------------------------------------------------------
KIT_STAGES="Discover Plan Build Review Release Done Operate"

STAGE_SKILLS_Discover="continuous-discovery using-skills"
STAGE_SKILLS_Plan="design plan using-skills"
STAGE_SKILLS_Build="build tdd debugging worktrees evals using-skills"
STAGE_SKILLS_Review="review verification demonstrate using-skills"
STAGE_SKILLS_Release="verification demonstrate operating using-skills"
STAGE_SKILLS_Done="verification demonstrate using-skills"
STAGE_SKILLS_Operate="operating debugging using-skills"
