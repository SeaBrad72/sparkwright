# .kit/model-map.conf — this project's tier → model mapping (CONTROL-PLANE; human-edited).
# Stamped by `incept` when absent. Every value is `unset`: the honest single-model case, in which every seat
# runs whatever model your harness is on and the tiers are advisory. Nothing goes red while it stays this way.
#
# To map your seats to models:
#   1. Set a value per tier to whatever your harness's spawn takes as its model parameter (an alias or an id;
#      the kit never interprets it). Two tiers may name the same model.
#   2. Write the reason in your CLAUDE.md under `#### Model fit rationale` (conformance/decision-integrity.sh model).
#   3. Record a DECISIONS entry (docs/governance/DECISIONS.md) with the evidence and a revisit trigger, then set
#      `decision=` to its id, `recorded=` to today, and `revisit-by=` to the date you will look again.
# Re-mapping later needs a measured A/B on real slices and a new entry that names the one it replaces.
decision=none
recorded=none
revisit-by=none
apex=unset
deep=unset
fast=unset
light=unset
